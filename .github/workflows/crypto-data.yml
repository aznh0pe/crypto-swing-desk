name: crypto-data

# The price feed the Crypto Swing Desk scans read (Coinbase public prices, no keys), published as the `data`
# branch. Crypto trades around the clock, so one run loops for about 5.5 hours, refreshing every 10 minutes,
# and then starts its successor. The crypto-watchdog workflow restarts the loop if it ever stops.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "auto (loop) | once (single pass) | history (full rebuild, single pass)"
        default: "auto"
  push:
    branches: [main]
    paths: ["pipeline/**", ".github/workflows/crypto-data.yml"]

concurrency:
  group: crypto-data
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - name: Install
        run: pip install -r pipeline/requirements.txt
      - name: Restore the current data branch
        run: |
          mkdir -p out
          if git fetch --depth 1 origin "data:refs/remotes/origin/data" 2>/dev/null; then
            git archive refs/remotes/origin/data | tar -x -C out
          fi
          ls -la out
      - name: Refresh loop
        env:
          MODE: ${{ github.event.inputs.mode || 'auto' }}
          PUSH_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: bash pipeline/refresh_loop.sh
