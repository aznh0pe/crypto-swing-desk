name: crypto-data

# Refreshes the `data` branch the Crypto Swing Desk scans read from (Coinbase public prices, no keys).
# Crypto trades around the clock, so this runs all day, every day. GitHub starts scheduled runs late or
# skips some at busy times; asking every 15 minutes gets a refresh through at least about once an hour.
on:
  schedule:
    - cron: "6,21,36,51 * * * *"
    - cron: "43 9 * * 0"          # Sunday: rebuild the full history (picks up revisions and new listings) + keepalive
  workflow_dispatch:
    inputs:
      mode:
        description: "auto | history"
        default: "auto"
  push:
    branches: [main]
    paths: ["pipeline/**", ".github/workflows/crypto-data.yml"]

concurrency:
  group: crypto-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - name: Install
        run: pip install -r pipeline/requirements.txt
      - name: Restore the current data branch
        run: |
          mkdir -p out
          if git fetch --depth 1 origin "data:refs/remotes/origin/data" 2>/dev/null; then
            git archive refs/remotes/origin/data | tar -x -C out
          fi
          ls -la out
      - name: Keep the schedule alive (GitHub pauses schedules after 60 days without commits)
        if: github.event.schedule == '43 9 * * 0'
        run: |
          last=$(git log -1 --format=%ct HEAD)
          days=$(( ( $(date +%s) - last ) / 86400 ))
          if [ "$days" -ge 40 ]; then
            git config user.name "crypto-swing-desk-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -q --allow-empty -m "keepalive: keep the crypto-data schedule active"
            git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:main || true
          fi
      - name: Fetch
        env:
          MODE: ${{ github.event.inputs.mode || (github.event.schedule == '43 9 * * 0' && 'history') || 'auto' }}
          OUT_DIR: out
        run: python pipeline/fetch_data.py
      - name: Publish the data branch (one squashed commit, no history bloat)
        run: |
          cd out
          rm -rf .git
          git init -q -b data
          git config user.name "crypto-swing-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data:data
